spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - "Path=/auth/**,/api/users/register"
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - "Path=/api/users/**"
            - id: product-service
              uri: http://localhost:8083
              predicates:
                - "Path=/api/products/**,/admin/products/**"
            - id: cart-service
              uri: http://localhost:8084
              predicates:
                - "Path=/api/cart/**"
            - id: order-service
              uri: http://localhost:8085
              predicates:
                - "Path=/api/orders/**"
            - id: payment-service
              uri: http://localhost:8086
              predicates:
                - "Path=/api/payments/**"

server:
  port: 8080
