spring.application.name=product-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/salessavvy_app
spring.datasource.username=root
spring.datasource.password=${SALESSAVVY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Must be the same Base64-encoded secret used by auth-service.
jwt.secret=${JWT_SECRET}
